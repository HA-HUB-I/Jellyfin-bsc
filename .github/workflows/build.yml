name: Build and Release Jellyfin Plugin

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.2.1.0)'
        required: true
        default: '1.2.1.0'
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Building tag release: v$VERSION"
          else
            VERSION="${{ github.event.inputs.version }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Building manual release: v$VERSION"
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Build plugin
        run: dotnet build --configuration Release

      - name: Prepare package
        run: |
          PLUGIN_DIR="Jellyfin.Plugin.BulsatcomChannel"

          # Prepare net10.0 package for Jellyfin 12.0
          mkdir -p "dist_net10/${PLUGIN_DIR}"
          cp "bin/Release/net10.0/${PLUGIN_DIR}.dll" "dist_net10/${PLUGIN_DIR}/"
          cp plugin.xml "dist_net10/${PLUGIN_DIR}/"
          (cd dist_net10 && zip -r ../plugin_net10.0.zip .)
          cp plugin_net10.0.zip plugin.zip

          # Prepare net9.0 package for Jellyfin 10.11
          mkdir -p "dist_net9/${PLUGIN_DIR}"
          cp "bin/Release/net9.0/${PLUGIN_DIR}.dll" "dist_net9/${PLUGIN_DIR}/"
          cp plugin.xml "dist_net9/${PLUGIN_DIR}/"
          (cd dist_net9 && zip -r ../plugin_net9.0.zip .)

      - name: Calculate MD5 checksums
        id: checksum
        run: |
          MD5_10=$(md5sum plugin_net10.0.zip | cut -d ' ' -f 1)
          MD5_9=$(md5sum plugin_net9.0.zip | cut -d ' ' -f 1)
          echo "md5_net10=${MD5_10^^}" >> $GITHUB_OUTPUT
          echo "md5_net9=${MD5_9^^}" >> $GITHUB_OUTPUT
          echo "MD5 .NET 10: ${MD5_10^^}"
          echo "MD5 .NET 9:  ${MD5_9^^}"

      - name: Update manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MD5_10="${{ steps.checksum.outputs.md5_net10 }}"
          MD5_9="${{ steps.checksum.outputs.md5_net9 }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          echo "Updating manifest with:"
          echo "  Version: $VERSION"
          echo "  Checksum .NET 10: $MD5_10"
          echo "  Checksum .NET 9:  $MD5_9"
          echo "  Timestamp: $TIMESTAMP"
          
          # Update manifest.json with both targetAbi entries
          jq --arg version "$VERSION" \
             --arg md5_10 "$MD5_10" \
             --arg md5_9 "$MD5_9" \
             --arg timestamp "$TIMESTAMP" \
             --arg url_10 "https://github.com/HA-HUB-I/Jellyfin-bsc/releases/download/v$VERSION/plugin_net10.0.zip" \
             --arg url_9 "https://github.com/HA-HUB-I/Jellyfin-bsc/releases/download/v$VERSION/plugin_net9.0.zip" \
             '.[0].versions = [
                {
                  "version": $version,
                  "changelog": "Release for Jellyfin 12.0 (.NET 10). Fixed Bulsatcom API program object deserialization. Stabilized streaming session with non-disruptive background updates (skips disk write and PVR tuner reload when playlist is unchanged), resilient session caching, and off-peak scheduling.",
                  "targetAbi": "12.0.0.0",
                  "sourceUrl": $url_10,
                  "checksum": $md5_10,
                  "timestamp": $timestamp
                },
                {
                  "version": $version,
                  "changelog": "Release for Jellyfin 10.11 (.NET 9). Fixed Bulsatcom API program object deserialization. Stabilized streaming session with non-disruptive background updates (skips disk write and PVR tuner reload when playlist is unchanged), resilient session caching, and off-peak scheduling.",
                  "targetAbi": "10.11.0.0",
                  "sourceUrl": $url_9,
                  "checksum": $md5_9,
                  "timestamp": $timestamp
                }
             ] + (.[0].versions | map(select(.version != $version)))' \
             manifest.json > manifest_updated.json && mv manifest_updated.json manifest.json
          
          echo "Updated manifest.json:"
          cat manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-v${{ steps.version.outputs.version }}
          path: |
            plugin.zip
            plugin_net10.0.zip
            plugin_net9.0.zip
            manifest.json

      - name: Create/Update Release
        if: github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Jellyfin Bulsatcom Plugin v${{ steps.version.outputs.version }}"
          body: |
            ## Jellyfin Bulsatcom File Generator Plugin v${{ steps.version.outputs.version }}
            
            ### Compatibility
            - **Jellyfin 12.0+**: Download `plugin_net10.0.zip` (built for .NET 10, ABI `12.0.0.0`)
            - **Jellyfin 10.11.x**: Download `plugin_net9.0.zip` (built for .NET 9, ABI `10.11.0.0`)
            
            ### Installation Instructions
            
            1. **Via Plugin Repository (Recommended):**
               - Add repository URL: `https://raw.githubusercontent.com/HA-HUB-I/Jellyfin-bsc/master/manifest.json`
               - Install from Jellyfin Plugin Catalog
               - Restart Jellyfin
            
            2. **Manual Installation:**
               - Download `plugin_net10.0.zip` (for Jellyfin 12) or `plugin_net9.0.zip` (for Jellyfin 10.11)
               - Extract to your Jellyfin plugins directory
               - Restart Jellyfin
            
            ### Configuration & Improvements
            - Stream session stabilization: skips disk writes and tuner resets when M3U is unchanged.
            - Prevents PVR clients (Kodi, etc.) from restarting during background refreshes.
            - Resilient Bulsatcom API caching with stream fallback protection.
            - Scheduled task runs daily at 04:00 AM off-peak by default.
            
            **MD5 Checksums:**
            - .NET 10 (Jellyfin 12): `${{ steps.checksum.outputs.md5_net10 }}`
            - .NET 9 (Jellyfin 10.11): `${{ steps.checksum.outputs.md5_net9 }}`
          files: |
            plugin.zip
            plugin_net10.0.zip
            plugin_net9.0.zip
          draft: false
          prerelease: false

      - name: Commit updated manifest
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          cp manifest.json /tmp/manifest.json
          git fetch origin master
          git checkout master
          git pull origin master --ff-only || true
          cp /tmp/manifest.json manifest.json
          git add manifest.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Update manifest for v${{ steps.version.outputs.version }} [skip ci]"
            git push origin master
          fi

